<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AYS WhatsApp Gönderim Paneli</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 40px 20px;
    }

    .panel {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 20px;
      margin-bottom: 8px;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
    }

    textarea {
      min-height: 150px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      font-size: 17px;
      cursor: pointer;
    }

    #durum {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="panel">

    <h1>AYS WhatsApp Gönderim Paneli</h1>

    <label>Ürün görseli</label>
    <input
      type="file"
      id="image"
      accept="image/*"
    >

    <label>Alıcı telefon numaraları</label>

    <textarea
      id="numbers"
      placeholder="905388933267&#10;905515991234"
    ></textarea>

    <button
      type="button"
      id="sendButton"
    >
      WhatsApp Mesajlarını Gönder
    </button>

    <div id="durum"></div>

  </div>
 
  <div class="panel" style="margin-top: 25px;">
  <h1>Bekleyen Yeni Müşteriler</h1>

  <div id="pendingCustomers">
    Bekleyen müşteriler yükleniyor...
  </div>
</div>
<div class="panel" style="margin-top: 25px;">
  <h1>Müşteri Portföyü</h1>

  <div id="customerPortfolio">
    Müşteri portföyü yükleniyor...
  </div>
</div>
  <script>

    var sendButton = document.getElementById("sendButton");
    var durum = document.getElementById("durum");

    sendButton.onclick = async function () {

      durum.innerText = "Butona basıldı - gönderim hazırlanıyor...";

      var imageInput = document.getElementById("image");
      var numbersInput = document.getElementById("numbers");

      var image = imageInput.files[0];
      var numbers = numbersInput.value;

      if (!image) {
        durum.innerText = "Lütfen bir görsel seçin.";
        return;
      }

      if (!numbers.trim()) {
        durum.innerText = "Lütfen en az bir telefon numarası girin.";
        return;
      }

      var formData = new FormData();

      formData.append("image", image);
      formData.append("numbers", numbers);

      try {
        isSending = true;

        var response = await fetch("/send-campaign", {
          method: "POST",
          body: formData
        });

        var result = await response.json();

        if (!response.ok) {
          durum.innerText =
            "Hata: " + (result.error || "Gönderim başarısız.");
          return;
        }

        durum.innerText =
          "Gönderilen: " +
          (result.sent || 0) +
          " | Hatalı: " +
          (result.failed || 0);

      } catch (error) {
    durum.innerText =
        "Bağlantı hatası: " + error.message;
} finally {
    isSending = false;
}
    };
    async function loadPendingCustomers() {
  var container = document.getElementById("pendingCustomers");

  try {
    var response = await fetch("/api/pending-customers");
    var customers = await response.json();

    if (!response.ok) {
      container.innerHTML = "Bekleyen müşteriler yüklenemedi.";
      return;
    }

    if (customers.length === 0) {
      container.innerHTML = "Bekleyen yeni müşteri yok.";
      return;
    }

    var html = "";

    customers.forEach(function (customer) {
  html +=
    "<div style='padding:15px; margin-bottom:12px; border:1px solid #ddd; border-radius:10px;'>" +
    "<strong>" + (customer.profile_name || "İsimsiz Müşteri") + "</strong><br>" +
    "Telefon: " + customer.phone + "<br>" +
    "İlk mesaj: " + (customer.first_message || "-") + "<br><br>" +
    "<label>Ad Soyad / Firma Adı</label>" +
"<input type='text' id='name-" + customer.id + "' placeholder='Ad Soyad veya Firma Adı' style='width:100%; padding:10px; margin-bottom:10px; box-sizing:border-box;' />" +
    "<label>Temsilci</label>" +
    "<select id='rep-" + customer.id + "' style='width:100%; padding:10px; margin-bottom:10px;'>" +
      "<option value=''>Temsilci seçin</option>" +
      "<option value='T1'>Ali Merter</option>" +
      "<option value='T2'>Harun Merter</option>" +
      "<option value='T3'>Muhammed Merter</option>" +
      "<option value='T4'>İshak Merter</option>" +
    "</select>" +

    "<label>Grup</label>" +
    "<select id='group-" + customer.id + "' style='width:100%; padding:10px; margin-bottom:10px;'>" +
      "<option value=''>Grup seçin</option>" +
      "<option value='Yerli'>Yerli</option>" +
      "<option value='Yabancı'>Yabancı</option>" +
    "</select>" +

    "<button type='button' onclick='approveCustomer(" + customer.id + ")'>" +
      "PORTFÖYE EKLE" +
    "</button>" +
    "<button type='button' onclick='rejectCustomer(" + customer.id + ")' style='margin-top:8px;'>" +
"SPAM / REDDET" +
"</button>" +
    "</div>";
});

    container.innerHTML = html;
  } catch (error) {
    container.innerHTML = "Bekleyen müşteriler yüklenirken bağlantı hatası oluştu.";
  }
}
async function approveCustomer(id) {
  var customerName = document.getElementById("name-" + id).value.trim();
  var representative = document.getElementById("rep-" + id).value;
  var group = document.getElementById("group-" + id).value;

  if (!customerName) {
    alert("Lütfen Ad Soyad / Firma Adı girin.");
    return;
}
  if (!representative) {
    alert("Lütfen müşteri temsilcisini seçin.");
    return;
  }

  if (!group) {
    alert("Lütfen Yerli veya Yabancı grubunu seçin.");
    return;
  }

  try {
    var response = await fetch("/api/approve-customer", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
     body: JSON.stringify({
    id: id,
    customer_name: customerName,
    representative_id: representative,
    customer_group: group
})
    });

    var result = await response.json();

    if (!response.ok) {
      alert(result.error || "Müşteri portföye eklenemedi.");
      return;
    }

    alert("Müşteri portföye eklendi.");
    await loadPendingCustomers();
  } catch (error) {
    alert("Bağlantı hatası: " + error.message);
  }
}
async function rejectCustomer(id) {
  var confirmed = confirm(
    "Bu müşteriyi SPAM / REDDET listesine almak istediğinize emin misiniz?"
  );

  if (!confirmed) {
    return;
  }

  try {
    var response = await fetch("/api/reject-customer", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        id: id
      })
    });

    var result = await response.json();

    if (!response.ok) {
      alert(result.error || "Müşteri reddedilemedi.");
      return;
    }

    alert("Müşteri SPAM / REDDET listesine alındı.");
    await loadPendingCustomers();
  } catch (error) {
    alert("Bağlantı hatası: " + error.message);
  }
}
    async function loadCustomerPortfolio() {
  var container = document.getElementById("customerPortfolio");

  try {
    var response = await fetch("/api/customers");
    var customers = await response.json();
    window.customerPortfolioData = customers;

    if (!response.ok) {
      container.innerHTML = "Müşteri portföyü yüklenemedi.";
      return;
    }

    if (customers.length === 0) {
      container.innerHTML = "Henüz portföye eklenmiş müşteri yok.";
      return;
    }

    var representativeNames = {
      T1: "Ali Merter",
      T2: "Harun Merter",
      T3: "Muhammed Merter",
      T4: "İshak Merter"
    };

    var html = `
  <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
    <input
      id="portfolioSearch"
      type="text"
      placeholder="İsim veya telefon ara..."
      oninput="renderCustomerPortfolio()"
      style="flex:2; min-width:220px; padding:8px;"
    >

    <select
      id="portfolioRepFilter"
      onchange="renderCustomerPortfolio()"
      style="flex:1; min-width:150px; padding:8px;"
    >
      <option value="">Tüm Temsilciler</option>
      <option value="T1">Ali Merter</option>
      <option value="T2">Harun Merter</option>
      <option value="T3">Muhammed Merter</option>
      <option value="T4">İshak Merter</option>
    </select>

    <select
      id="portfolioGroupFilter"
      onchange="renderCustomerPortfolio()"
      style="flex:1; min-width:120px; padding:8px;"
    >
      <option value="">Tüm Gruplar</option>
      <option value="Yerli">Yerli</option>
      <option value="Yabancı">Yabancı</option>
    </select>

    <select
      id="portfolioStatusFilter"
      onchange="renderCustomerPortfolio()"
      style="flex:1; min-width:120px; padding:8px;"
    >
      <option value="">Tüm Durumlar</option>
      <option value="active">Aktif</option>
      <option value="passive">Pasif</option>
    </select>
  </div>

  <div id="portfolioRows"></div>
`;

container.innerHTML = html;
renderCustomerPortfolio();

  } catch (error) {
    container.innerHTML = "Müşteri portföyü yüklenirken bağlantı hatası oluştu.";
  }
}
    function renderCustomerPortfolio() {
    var customers = window.customerPortfolioData || [];
    var rowsContainer = document.getElementById("portfolioRows");

    if (!rowsContainer) return;

    var search =
        (document.getElementById("portfolioSearch")?.value || "")
        .toLocaleLowerCase("tr-TR")
        .trim();

    var repFilter =
        document.getElementById("portfolioRepFilter")?.value || "";

    var groupFilter =
        document.getElementById("portfolioGroupFilter")?.value || "";

    var statusFilter =
        document.getElementById("portfolioStatusFilter")?.value || "";

    var representativeNames = {
        T1: "Ali Merter",
        T2: "Harun Merter",
        T3: "Muhammed Merter",
        T4: "İshak Merter"
    };

    var filteredCustomers = customers.filter(function(customer) {
        var name = (customer.customer_name || "İsimsiz Müşteri")
            .toLocaleLowerCase("tr-TR");

        var phone = String(customer.phone || "");

        var matchesSearch =
            !search ||
            name.includes(search) ||
            phone.includes(search);

        var matchesRep =
            !repFilter ||
            customer.representative_id === repFilter;

        var matchesGroup =
            !groupFilter ||
            customer.customer_group === groupFilter;

        var matchesStatus =
            !statusFilter ||
            customer.status === statusFilter;

        return matchesSearch &&
               matchesRep &&
               matchesGroup &&
               matchesStatus;
    });

    if (filteredCustomers.length === 0) {
        rowsContainer.innerHTML =
            '<div style="padding:12px;">Filtreye uygun müşteri bulunamadı.</div>';
        return;
    }

    var rowsHtml = "";

    filteredCustomers.forEach(function(customer) {
        var representativeName =
            representativeNames[customer.representative_id] ||
            customer.representative_id;

        var statusText =
            customer.status === "active"
                ? "🟢 Aktif"
                : "🔴 Pasif";

        var newStatus =
            customer.status === "active"
                ? "passive"
                : "active";

        var buttonText =
            customer.status === "active"
                ? "PASİFE AL"
                : "AKTİFLEŞTİR";

        rowsHtml +=
            '<div style="display:grid; grid-template-columns:2fr 1.4fr 1.3fr 1fr 1fr 1fr; gap:8px; align-items:center; padding:4px 8px; border-bottom:1px solid #ddd;">' +

            '<strong>' +
            (customer.customer_name || "İsimsiz Müşteri") +
            '</strong>' +

            '<span>' + customer.phone + '</span>' +

            '<span>' + representativeName + '</span>' +

            '<span>' + customer.customer_group + '</span>' +

            '<span>' + statusText + '</span>' +

            '<button type="button" onclick="changeCustomerStatus(' +
            customer.id + ', \'' + newStatus + '\')">' +
            buttonText +
            '</button>' +

            '</div>';
    });

    rowsContainer.innerHTML = rowsHtml;
}
async function changeCustomerStatus(id, newStatus) {
  try {
    var response = await fetch("/api/customer-status", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        id: id,
        status: newStatus
      })
    });

    var result = await response.json();

    if (!response.ok) {
      alert(result.error || "Müşteri durumu değiştirilemedi.");
      return;
    }

    await loadCustomerPortfolio();
  } catch (error) {
    alert("Bağlantı hatası: " + error.message);
  }
}
    loadPendingCustomers();
    loadCustomerPortfolio();
    
    var isSending = false;

setInterval(function () {
    if (!isSending) {
        loadPendingCustomers();
    }
}, 300000);
  </script>

</body>
</html>
