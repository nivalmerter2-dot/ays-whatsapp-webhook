<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AYS WhatsApp Gönderim Paneli</title>

  <style>
    body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #1f2937;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
}

* {
    box-sizing: border-box;
}

.panel {
    width: 100%;
    max-width: none;
    margin: 0;
    background: #ffffff;
    padding: 20px;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

h1 {
    margin: 0 0 16px 0;
    font-size: 24px;
    line-height: 1.25;
    color: #111827;
}

h2 {
    margin: 0 0 14px 0;
    font-size: 19px;
    line-height: 1.3;
    color: #111827;
}

label {
    display: block;
    font-weight: 600;
    font-size: 13px;
    margin-top: 14px;
    margin-bottom: 6px;
    color: #374151;
}

input,
textarea,
select {
    font-family: inherit;
    font-size: 13px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    background: #ffffff;
}

input,
textarea {
    width: 100%;
    padding: 9px 10px;
}

select {
    padding: 8px 10px;
}

textarea {
    min-height: 115px;
    resize: vertical;
}

button {
    width: auto;
    padding: 8px 13px;
    margin-top: 8px;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.2;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    background: #ffffff;
    color: #1f2937;
    cursor: pointer;
    transition: 0.15s ease;
}

button:hover {
    background: #f3f4f6;
    border-color: #9ca3af;
}

#sendButton {
    width: 100%;
    padding: 11px 16px;
    margin-top: 14px;
    font-size: 14px;
    background: #16794b;
    border-color: #16794b;
    color: white;
}

#sendButton:hover {
    background: #12663f;
}

#durum {
    margin-top: 12px;
    font-size: 13px;
    font-weight: 600;
}

.dashboard {
    width: min(94vw, 1750px);
    margin: 0 auto;
}

.dashboard-title {
    margin-bottom: 16px;
}

.dashboard-grid {
    display: grid;
    grid-template-columns: minmax(300px, 0.34fr) minmax(600px, 0.66fr);
    gap: 16px;
    align-items: start;
}

.dashboard-left,
.dashboard-right {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

@media (max-width: 1000px) {
    body {
        padding: 12px;
    }

    .dashboard {
        width: 100%;
    }

    .dashboard-grid {
        grid-template-columns: 1fr;
    }

    .panel {
        padding: 16px;
    }
}
  </style>
</head>

<body>
  
<div class="dashboard">
  <div class="dashboard-grid">

    <div class="dashboard-left">
  <div class="panel">
  
    <h1>AYS WhatsApp Gönderim Paneli</h1>

    <label>Ürün görseli</label>
    <input
      type="file"
      id="image"
      accept="image/*"
    >

    <label>Alıcı telefon numaraları</label>

    <textarea
      id="numbers"
      placeholder="905388933267&#10;905515991234"
    ></textarea>

    <button
      type="button"
      id="sendButton"
    >
      WhatsApp Mesajlarını Gönder
    </button>

    <div id="durum"></div>

  </div>
 </div>

    <div class="dashboard-right">
  <div class="panel" style="margin-top: 25px;">
  <h1>Bekleyen Yeni Müşteriler</h1>

  <div id="pendingCustomers">
    Bekleyen müşteriler yükleniyor...
  </div>
</div>
<div class="panel" style="margin-top: 25px;">
  <h1>Müşteri Portföyü</h1>

  <div id="customerPortfolio">
    Müşteri portföyü yükleniyor...
  </div>
</div>
  <div class="panel" style="margin-top:25px;">
  <h1>Spam / Reddedilenler</h1>

  <input
    id="rejectedSearch"
    type="text"
    placeholder="İsim veya telefon ara..."
    oninput="renderRejectedCustomers()"
    style="width:100%; box-sizing:border-box; padding:8px; margin-bottom:10px;"
  >

  <div id="rejectedCustomers">
    Spam listesi yükleniyor...
  </div>
</div>
  <div class="panel" style="margin-top:25px;">
  <h1>Kampanya Raporları</h1>

  <button
    type="button"
    onclick="loadCampaignReports()"
    style="margin-bottom:10px;"
  >
    RAPORLARI YENİLE
  </button>

  <div id="campaignReports">
    Kampanya raporları yükleniyor...
  </div>

  <div
    id="campaignFailureDetails"
    style="margin-top:15px;"
  ></div>
</div>
      </div>
  </div>
</div>
  <script>

    var sendButton = document.getElementById("sendButton");
    var durum = document.getElementById("durum");

    sendButton.onclick = async function () {

      durum.innerText = "Butona basıldı - gönderim hazırlanıyor...";

      var imageInput = document.getElementById("image");
      var numbersInput = document.getElementById("numbers");

      var image = imageInput.files[0];
      var numbers = numbersInput.value;

      if (!image) {
        durum.innerText = "Lütfen bir görsel seçin.";
        return;
      }

      if (!numbers.trim()) {
        durum.innerText = "Lütfen en az bir telefon numarası girin.";
        return;
      }

      var formData = new FormData();

      formData.append("image", image);
      formData.append("numbers", numbers);

      try {
        isSending = true;

        var response = await fetch("/send-campaign", {
          method: "POST",
          body: formData
        });

        var result = await response.json();

        if (!response.ok) {
          durum.innerText =
            "Hata: " + (result.error || "Gönderim başarısız.");
          return;
        }

        durum.innerText =
          "Gönderilen: " +
          (result.sent || 0) +
          " | Hatalı: " +
          (result.failed || 0);

      } catch (error) {
    durum.innerText =
        "Bağlantı hatası: " + error.message;
} finally {
    isSending = false;
}
    };
    async function loadPendingCustomers() {
  var container = document.getElementById("pendingCustomers");

  try {
    var response = await fetch("/api/pending-customers");
    var customers = await response.json();

    if (!response.ok) {
      container.innerHTML = "Bekleyen müşteriler yüklenemedi.";
      return;
    }

    if (customers.length === 0) {
      container.innerHTML = "Bekleyen yeni müşteri yok.";
      return;
    }

    var html = "";

    customers.forEach(function (customer) {
  html +=
    "<div style='padding:15px; margin-bottom:12px; border:1px solid #ddd; border-radius:10px;'>" +
    "<strong>" + (customer.profile_name || "İsimsiz Müşteri") + "</strong><br>" +
    "Telefon: " + customer.phone + "<br>" +
    "İlk mesaj: " + (customer.first_message || "-") + "<br><br>" +
    "<label>Ad Soyad / Firma Adı</label>" +
"<input type='text' id='name-" + customer.id + "' placeholder='Ad Soyad veya Firma Adı' style='width:100%; padding:10px; margin-bottom:10px; box-sizing:border-box;' />" +
    "<label>Temsilci</label>" +
    "<select id='rep-" + customer.id + "' style='width:100%; padding:10px; margin-bottom:10px;'>" +
      "<option value=''>Temsilci seçin</option>" +
      "<option value='T1'>Ali Merter</option>" +
      "<option value='T2'>Harun Merter</option>" +
      "<option value='T3'>Muhammed Merter</option>" +
      "<option value='T4'>İshak Merter</option>" +
    "</select>" +

    "<label>Grup</label>" +
    "<select id='group-" + customer.id + "' style='width:100%; padding:10px; margin-bottom:10px;'>" +
      "<option value=''>Grup seçin</option>" +
      "<option value='Yerli'>Yerli</option>" +
      "<option value='Yabancı'>Yabancı</option>" +
    "</select>" +

    "<button type='button' onclick='approveCustomer(" + customer.id + ")'>" +
      "PORTFÖYE EKLE" +
    "</button>" +
    "<button type='button' onclick='rejectCustomer(" + customer.id + ")' style='margin-top:8px;'>" +
"SPAM / REDDET" +
"</button>" +
    "</div>";
});

    container.innerHTML = html;
  } catch (error) {
    container.innerHTML = "Bekleyen müşteriler yüklenirken bağlantı hatası oluştu.";
  }
}
async function approveCustomer(id) {
  var customerName = document.getElementById("name-" + id).value.trim();
  var representative = document.getElementById("rep-" + id).value;
  var group = document.getElementById("group-" + id).value;

  if (!customerName) {
    alert("Lütfen Ad Soyad / Firma Adı girin.");
    return;
}
  if (!representative) {
    alert("Lütfen müşteri temsilcisini seçin.");
    return;
  }

  if (!group) {
    alert("Lütfen Yerli veya Yabancı grubunu seçin.");
    return;
  }

  try {
    var response = await fetch("/api/approve-customer", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
     body: JSON.stringify({
    id: id,
    customer_name: customerName,
    representative_id: representative,
    customer_group: group
})
    });

    var result = await response.json();

    if (!response.ok) {
      alert(result.error || "Müşteri portföye eklenemedi.");
      return;
    }

    alert("Müşteri portföye eklendi.");
    await loadPendingCustomers();
  } catch (error) {
    alert("Bağlantı hatası: " + error.message);
  }
}
async function rejectCustomer(id) {
  var confirmed = confirm(
    "Bu müşteriyi SPAM / REDDET listesine almak istediğinize emin misiniz?"
  );

  if (!confirmed) {
    return;
  }

  try {
    var response = await fetch("/api/reject-customer", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        id: id
      })
    });

    var result = await response.json();

    if (!response.ok) {
      alert(result.error || "Müşteri reddedilemedi.");
      return;
    }

    alert("Müşteri SPAM / REDDET listesine alındı.");
    await loadPendingCustomers();
  } catch (error) {
    alert("Bağlantı hatası: " + error.message);
  }
}
    async function loadCustomerPortfolio() {
  var container = document.getElementById("customerPortfolio");

  try {
    var response = await fetch("/api/customers");
    var customers = await response.json();
    window.customerPortfolioData = customers;

    if (!response.ok) {
      container.innerHTML = "Müşteri portföyü yüklenemedi.";
      return;
    }

    if (customers.length === 0) {
      container.innerHTML = "Henüz portföye eklenmiş müşteri yok.";
      return;
    }

    var representativeNames = {
      T1: "Ali Merter",
      T2: "Harun Merter",
      T3: "Muhammed Merter",
      T4: "İshak Merter"
    };

    var html = `
  <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
    <input
      id="portfolioSearch"
      type="text"
      placeholder="İsim veya telefon ara..."
      oninput="renderCustomerPortfolio()"
      style="flex:2; min-width:220px; padding:8px;"
    >

    <select
      id="portfolioRepFilter"
      onchange="renderCustomerPortfolio()"

    >
      <option value="">Tüm Temsilciler</option>
      <option value="T1">Ali Merter</option>
      <option value="T2">Harun Merter</option>
      <option value="T3">Muhammed Merter</option>

    >

    </select>

      <option value="passive">Pasif</option>
    </select>
  </div>
<div style="margin:10px 0 14px 0;">
  <button
    type="button"
    onclick="addFilteredCustomersToCampaign()"
  >
    FİLTRELENENLERİ KAMPANYAYA EKLE
  </button>

  <button
    type="button"
    onclick="clearCampaignRecipients()"
    style="margin-left:8px;"
  >
    KAMPANYA SEÇİMİNİ TEMİZLE
  </button>

  <div
    id="campaignRecipientSummary"
    style="margin-top:8px; font-weight:bold;"
  >
    Kampanya alıcısı seçilmedi.
  </div>
</div>
<div style="margin:12px 0 14px 0; padding-top:10px; border-top:1px solid #ddd;">

  <strong>Excel İşlemleri</strong>

  <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">

    <button
      type="button"
      onclick="exportFilteredCustomersToExcel()"
    >
      FİLTRELENENLERİ EXCEL'E AKTAR
    </button>

    <button
      type="button"
      onclick="document.getElementById('customerExcelFile').click()"
    >
      EXCEL'DEN MÜŞTERİ İÇE AKTAR
    </button>

    <button
      type="button"
      onclick="downloadCustomerExcelTemplate()"
    >
      ÖRNEK EXCEL ŞABLONU
    </button>

    <input
      id="customerExcelFile"
      type="file"
      accept=".xlsx,.xls"
      style="display:none;"
      onchange="importCustomersFromExcel(this)"
    >

  </div>

  <div
    id="excelImportStatus"
    style="margin-top:8px;"
  ></div>

</div>
  <div id="portfolioRows"></div>
`;

container.innerHTML = html;
renderCustomerPortfolio();

  } catch (error) {
    container.innerHTML = "Müşteri portföyü yüklenirken bağlantı hatası oluştu.";
  }
}
    function renderCustomerPortfolio() {
    var customers = window.customerPortfolioData || [];
    var rowsContainer = document.getElementById("portfolioRows");

    if (!rowsContainer) return;

    var search =
        (document.getElementById("portfolioSearch")?.value || "")
        .toLocaleLowerCase("tr-TR")
        .trim();

    var repFilter =
        document.getElementById("portfolioRepFilter")?.value || "";

    var groupFilter =
        document.getElementById("portfolioGroupFilter")?.value || "";

    var statusFilter =
        document.getElementById("portfolioStatusFilter")?.value || "";

    var representativeNames = {
        T1: "Ali Merter",
        T2: "Harun Merter",
        T3: "Muhammed Merter",
        T4: "İshak Merter"
    };

    var filteredCustomers = customers.filter(function(customer) {
        var name = (customer.customer_name || "İsimsiz Müşteri")
            .toLocaleLowerCase("tr-TR");

        var phone = String(customer.phone || "");

        var matchesSearch =
            !search ||
            name.includes(search) ||
            phone.includes(search);

        var matchesRep =
            !repFilter ||
            customer.representative_id === repFilter;

        var matchesGroup =
            !groupFilter ||
            customer.customer_group === groupFilter;

        var matchesStatus =
            !statusFilter ||
            customer.status === statusFilter;

        return matchesSearch &&
               matchesRep &&
               matchesGroup &&
               matchesStatus;
    });
  window.currentFilteredCustomers = filteredCustomers;
    if (filteredCustomers.length === 0) {
        rowsContainer.innerHTML =
            '<div style="padding:12px;">Filtreye uygun müşteri bulunamadı.</div>';
        return;
    }

    var rowsHtml = "";

    filteredCustomers.forEach(function(customer) {
        var representativeName =
            representativeNames[customer.representative_id] ||
            customer.representative_id;

        var statusText =
            customer.status === "active"
                ? "🟢 Aktif"
                : "🔴 Pasif";

        var newStatus =
            customer.status === "active"
                ? "passive"
                : "active";

        var buttonText =
            customer.status === "active"
                ? "PASİFE AL"
                : "AKTİFLEŞTİR";

        rowsHtml +=
            '<div style="display:grid; grid-template-columns:2fr 1.4fr 1.3fr 1fr 1fr 1fr; gap:8px; align-items:center; padding:4px 8px; border-bottom:1px solid #ddd;">' +

            '<strong>' +
            (customer.customer_name || "İsimsiz Müşteri") +
            '</strong>' +

            '<span>' + customer.phone + '</span>' +

            '<span>' + representativeName + '</span>' +

            '<span>' + customer.customer_group + '</span>' +

            '<span>' + statusText + '</span>' +

            '<div style="display:flex; gap:4px;">' +

'<button type="button" ' +
'style="padding:4px 6px; font-size:10px; white-space:nowrap;" ' +
'onclick="changeCustomerStatus(' +
customer.id + ', \'' + newStatus + '\')">' +
buttonText +
'</button>' +

'<button type="button" ' +
'style="padding:4px 6px; font-size:10px; white-space:nowrap;" ' +
'onclick="deleteCustomer(' + customer.id + ')">' +
'SİL' +
'</button>' +

'</div>' +

            '</div>';
    });

    rowsContainer.innerHTML = rowsHtml;
}
    async function deleteCustomer(id) {
  var confirmed = confirm(
    "Bu müşteriyi portföyden kalıcı olarak silmek istediğinize emin misiniz?"
  );

  if (!confirmed) {
    return;
  }

  try {
    var response = await fetch("/api/customer-delete", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        id: id
      })
    });

    var result = await response.json();

    if (!response.ok) {
      alert(result.error || "Müşteri silinemedi.");
      return;
    }

    await loadCustomerPortfolio();
  } catch (error) {
    alert("Bağlantı hatası: " + error.message);
  }
}
async function changeCustomerStatus(id, newStatus) {
  try {
    var response = await fetch("/api/customer-status", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        id: id,
        status: newStatus
      })
    });

    var result = await response.json();

    if (!response.ok) {
      alert(result.error || "Müşteri durumu değiştirilemedi.");
      return;
    }

    await loadCustomerPortfolio();
  } catch (error) {
    alert("Bağlantı hatası: " + error.message);
  }
}
    async function loadRejectedCustomers() {
  var container = document.getElementById("rejectedCustomers");

  try {
    var response = await fetch("/api/rejected-customers");
    var customers = await response.json();

    if (!response.ok) {
      container.innerHTML = "Spam listesi yüklenemedi.";
      return;
    }

    window.rejectedCustomerData = customers;
    renderRejectedCustomers();
  } catch (error) {
    container.innerHTML = "Spam listesi yüklenirken bağlantı hatası oluştu.";
  }
}

function renderRejectedCustomers() {
  var container = document.getElementById("rejectedCustomers");
  var customers = window.rejectedCustomerData || [];

  if (!container) return;

  var search =
    (document.getElementById("rejectedSearch")?.value || "")
      .toLocaleLowerCase("tr-TR")
      .trim();

  var filteredCustomers = customers.filter(function(customer) {
    var name = (customer.profile_name || "İsimsiz")
      .toLocaleLowerCase("tr-TR");

    var phone = String(customer.phone || "");

    return !search ||
      name.includes(search) ||
      phone.includes(search);
  });

  if (filteredCustomers.length === 0) {
    container.innerHTML =
      '<div style="padding:8px;">Spam listesinde müşteri yok.</div>';
    return;
  }

  var html = "";

  filteredCustomers.forEach(function(customer) {
    html +=
      '<div style="display:grid; grid-template-columns:2fr 1.5fr 1fr; gap:8px; align-items:center; padding:5px 8px; border-bottom:1px solid #ddd;">' +
      '<strong>' + (customer.profile_name || "İsimsiz") + '</strong>' +
      '<span>' + customer.phone + '</span>' +
      '<button type="button" ' +
      'style="padding:4px 6px; font-size:10px; white-space:nowrap;" ' +
      'onclick="restoreRejectedCustomer(' + customer.id + ')">' +
      'SPAMDAN ÇIKAR' +
      '</button>' +
      '</div>';
  });

  container.innerHTML = html;
}

async function restoreRejectedCustomer(id) {
  var confirmed = confirm(
    "Bu müşteriyi spam listesinden çıkarıp Bekleyen Yeni Müşteriler bölümüne almak istediğinize emin misiniz?"
  );

  if (!confirmed) return;

  try {
    var response = await fetch("/api/rejected-customer-restore", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        id: id
      })
    });

    var result = await response.json();

    if (!response.ok) {
      alert(result.error || "Müşteri spam listesinden çıkarılamadı.");
      return;
    }

    await loadRejectedCustomers();
    await loadPendingCustomers();

  } catch (error) {
    alert("Bağlantı hatası: " + error.message);
  }
}
    loadPendingCustomers();
    loadCustomerPortfolio();
    loadRejectedCustomers();
    
    var isSending = false;

setInterval(function () {
    if (!isSending) {
        loadPendingCustomers();
    }
}, 300000);
    async function loadCampaignReports() {
  var container = document.getElementById("campaignReports");

  try {
    container.innerHTML = "Kampanya raporları yükleniyor...";

    var response = await fetch("/api/campaign-reports");
    var data = await response.json();

    if (!response.ok || !data.success) {
      container.innerHTML = "Kampanya raporları alınamadı.";
      return;
    }

    if (!data.campaigns || data.campaigns.length === 0) {
      container.innerHTML = "Henüz kampanya raporu bulunmuyor.";
      return;
    }

    var html = "";

    data.campaigns.forEach(function (campaign) {
      var target = Number(campaign.total_recipients || 0);
      var accepted = Number(campaign.accepted_count || 0);
      var initialFailed = Number(campaign.initial_failed_count || 0);
      var sent = Number(campaign.sent_count || 0);
      var delivered = Number(campaign.delivered_count || 0);
      var read = Number(campaign.read_count || 0);
      var deliveryFailed = Number(campaign.delivery_failed_count || 0);

      var deliveryRate =
        accepted > 0 ? ((delivered / accepted) * 100).toFixed(1) : "0.0";

      var readRate =
        delivered > 0 ? ((read / delivered) * 100).toFixed(1) : "0.0";

      var failureRate =
        accepted > 0 ? ((deliveryFailed / accepted) * 100).toFixed(1) : "0.0";

      var dateText = campaign.created_at
        ? new Date(campaign.created_at).toLocaleString("tr-TR")
        : "-";

      var campaignErrors = (data.error_summary || []).filter(function (item) {
        return String(item.campaign_id) === String(campaign.id);
      });

      var errorHtml = "";

      if (campaignErrors.length > 0) {
        errorHtml = "<div style='margin-top:8px;'><strong>Hata Kodları:</strong>";

        campaignErrors.forEach(function (item) {
          errorHtml +=
            "<div style='padding:4px 0;'>" +
            "<strong>" + (item.error_code || "Kod yok") + "</strong>" +
            " — " + item.error_count + " kişi" +
            (item.error_title ? " — " + item.error_title : "") +
            "</div>";
        });

        errorHtml += "</div>";
      }

      html +=
        "<div style='border:1px solid #ddd; border-radius:8px; padding:12px; margin-bottom:12px;'>" +
          "<div style='font-size:16px; font-weight:bold; margin-bottom:8px;'>" +
            "Kampanya #" + campaign.id + " — " + dateText +
          "</div>" +

          "<div><strong>Hedef:</strong> " + target + "</div>" +
          "<div><strong>Meta kabul:</strong> " + accepted + "</div>" +
          "<div><strong>Başlangıçta başarısız / atlanan:</strong> " + initialFailed + "</div>" +
          "<div><strong>Gönderildi:</strong> " + sent + "</div>" +
          "<div><strong>Teslim edildi:</strong> " + delivered +
            " (%" + deliveryRate + ")</div>" +
          "<div><strong>Okundu:</strong> " + read +
            " (%" + readRate + ")</div>" +
          "<div><strong>Teslim edilemedi:</strong> " + deliveryFailed +
            " (%" + failureRate + ")</div>" +

          errorHtml +

          "<button type='button' " +
            "onclick='showCampaignFailures(" + campaign.id + ")' " +
            "style='margin-top:10px;'>" +
            "HATA VEREN NUMARALARI GÖSTER" +
          "</button>" +
        "</div>";
    });

    container.innerHTML = html;

  } catch (error) {
    console.error("Kampanya raporu bağlantı hatası:", error);
    container.innerHTML = "Kampanya raporları yüklenirken bağlantı hatası oluştu.";
  }
}


async function showCampaignFailures(campaignId) {
  var container = document.getElementById("campaignFailureDetails");

  try {
    container.innerHTML = "Hata veren numaralar yükleniyor...";

    var response = await fetch("/api/campaign-failures");
    var data = await response.json();

    if (!response.ok || !data.success) {
      container.innerHTML = "Hata detayları alınamadı.";
      return;
    }

    var failures = (data.failures || []).filter(function (item) {
      return String(item.campaign_id) === String(campaignId);
    });

    if (failures.length === 0) {
      container.innerHTML =
        "<div style='padding:10px; border:1px solid #ddd;'>" +
        "Bu kampanyada Meta teslimat hatası görünmüyor." +
        "</div>";
      return;
    }

    var html =
      "<div style='border:1px solid #bbb; border-radius:8px; padding:12px;'>" +
      "<h2>Kampanya #" + campaignId + " — Hata Veren Numaralar</h2>";

    failures.forEach(function (item) {
      html +=
        "<div style='padding:10px 0; border-bottom:1px solid #ddd;'>" +
          "<strong>Telefon:</strong> " + (item.phone || "-") + "<br>" +
          "<strong>Hata kodu:</strong> " + (item.error_code || "Kod yok") + "<br>" +
          "<strong>Açıklama:</strong> " +
            (item.error_title || item.error_message || "-") + "<br>" +
          "<strong>Toplam teslimat hatası:</strong> " +
            item.total_failures + "<br>" +
          "<strong>Aynı hata kodu:</strong> " +
            item.same_error_failures + " kez<br>" +
          "<strong>Hata yaşadığı kampanya:</strong> " +
            item.failed_campaign_count + " farklı kampanya" +
        "</div>";
    });

    html +=
      "<button type='button' onclick='closeCampaignFailures()' " +
      "style='margin-top:10px;'>DETAYI KAPAT</button>" +
      "</div>";

    container.innerHTML = html;

  } catch (error) {
    console.error("Hata detayları bağlantı hatası:", error);
    container.innerHTML = "Hata detayları yüklenirken bağlantı hatası oluştu.";
  }
}


function closeCampaignFailures() {
  document.getElementById("campaignFailureDetails").innerHTML = "";
}

    window.campaignRecipients = window.campaignRecipients || new Map();

function addFilteredCustomersToCampaign() {
  var filtered = window.currentFilteredCustomers || [];

  // Kampanyaya yalnızca aktif ve telefonu bulunan müşteriler alınır.
  var activeCustomers = filtered.filter(function (customer) {
    return customer.status === "active" && customer.phone;
  });

  var beforeCount = window.campaignRecipients.size;

  activeCustomers.forEach(function (customer) {
    var phone = String(customer.phone || "").replace(/\D/g, "");

    if (!phone) return;

    // Telefon numarası anahtar olduğu için aynı müşteri ikinci kez eklenmez.
    window.campaignRecipients.set(phone, {
      phone: phone,
      customer_name: customer.customer_name || "İsimsiz Müşteri",
      representative_id: customer.representative_id || "",
      customer_group: customer.customer_group || ""
    });
  });

  var afterCount = window.campaignRecipients.size;
  var newlyAdded = afterCount - beforeCount;

  syncCampaignRecipientsToInput();

  var summary = document.getElementById("campaignRecipientSummary");

  if (summary) {
    summary.innerHTML =
      "Kampanya alıcıları: <strong>" +
      afterCount +
      " benzersiz aktif müşteri</strong>" +
      " — Son seçimden " +
      newlyAdded +
      " yeni müşteri eklendi.";
  }
}

function syncCampaignRecipientsToInput() {
  var numbersInput = document.getElementById("numbers");

  if (!numbersInput) return;

  var phones = Array.from(window.campaignRecipients.keys());

  numbersInput.value = phones.join("\n");
}


function clearCampaignRecipients() {
  window.campaignRecipients.clear();

  var numbersInput = document.getElementById("numbers");

  if (numbersInput) {
    numbersInput.value = "";
  }

  var summary = document.getElementById("campaignRecipientSummary");

  if (summary) {
    summary.innerHTML = "Kampanya alıcısı seçilmedi.";
  }
}

async function exportFilteredCustomersToExcel() {
  var customers = window.currentFilteredCustomers || [];
  var statusBox = document.getElementById("excelImportStatus");

  if (customers.length === 0) {
    if (statusBox) {
      statusBox.innerText = "Dışa aktarılacak müşteri bulunamadı.";
    }
    return;
  }

  var ids = customers
    .map(function (customer) {
      return customer.id;
    })
    .filter(function (id) {
      return id;
    });

  if (ids.length === 0) {
    if (statusBox) {
      statusBox.innerText = "Geçerli müşteri bulunamadı.";
    }
    return;
  }

  try {
    if (statusBox) {
      statusBox.innerText =
        customers.length + " müşteri Excel'e hazırlanıyor...";
    }

    var response = await fetch("/api/customers/export-excel", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        ids: ids
      })
    });

    if (!response.ok) {
      var errorData = await response.json().catch(function () {
        return {};
      });

      throw new Error(
        errorData.error || "Excel dışa aktarılamadı."
      );
    }

    var blob = await response.blob();
    var url = URL.createObjectURL(blob);

    var link = document.createElement("a");
    link.href = url;
    link.download = "musteri_portfoyu.xlsx";

    document.body.appendChild(link);
    link.click();
    link.remove();

    URL.revokeObjectURL(url);

    if (statusBox) {
      statusBox.innerText =
        customers.length + " müşteri Excel'e aktarıldı.";
    }
  } catch (error) {
    if (statusBox) {
      statusBox.innerText =
        "Excel dışa aktarma hatası: " + error.message;
    }
  }
}


async function importCustomersFromExcel(input) {
  var statusBox = document.getElementById("excelImportStatus");

  if (!input.files || !input.files[0]) {
    return;
  }

  var file = input.files[0];
  var formData = new FormData();

  formData.append("file", file);

  try {
    if (statusBox) {
      statusBox.innerText = "Excel dosyası içe aktarılıyor...";
    }

    var response = await fetch("/api/customers/import-excel", {
      method: "POST",
      body: formData
    });

    var data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(
        data.error || "Excel dosyası içe aktarılamadı."
      );
    }

    var message =
      "İçe aktarma tamamlandı. " +
      "Yeni eklenen: " + data.added +
      " | Zaten kayıtlı: " + data.existing +
      " | Excel içinde tekrar: " + data.duplicate_in_file +
      " | Geçersiz: " + data.invalid;

    if (statusBox) {
      statusBox.innerText = message;
    }
    alert(message);
    input.value = "";

    await loadCustomerPortfolio();

  } catch (error) {
    if (statusBox) {
      statusBox.innerText =
        "Excel içe aktarma hatası: " + error.message;
    }

    input.value = "";
  }
}
